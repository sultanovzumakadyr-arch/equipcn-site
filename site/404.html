<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipcn — переходим на новый сайт</title><meta name="robots" content="noindex">
<script>
(function(){
  var p=location.pathname, to='/';
  var m=p.match(/\/p(\d+)-/);                      // старые ссылки на товары Сату: /p123456-nazvanie.html
  var g={'9494028':'metal','9667698':'power','9675113':'fish','9682295':'air','9682296':'agro'};
  var gm=p.match(/\/g(\d+)-/);                     // старые группы Сату: /g9494028-...
  if(m) to='/p/'+m[1];
  else if(gm&&g[gm[1]]) to='/#cat-'+g[gm[1]];
  else if(/product_list|\/g\d+/.test(p)) to='/#catalog';
  else if(/contacts|delivery|about|info/.test(p)) to='/#contact';
  location.replace(to);
})();
</script></head>
<body style="font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#0f1d33">
<p>Переходим на новый сайт Equipcn…</p><p><a href="/">Открыть главную</a></p>
</body></html>
